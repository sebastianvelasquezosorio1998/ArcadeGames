<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Perlas del Abismo</title>
<style>
:root{--bg:#06141c;--bg2:#0a1f2b;--card:#0e2a3a;--card2:#123548;--line:#1e4a5f;
--gold:#f6c945;--gold2:#c8951c;--pearl:#f3ead2;--cyan:#4fe3e0;--cyan2:#1fa9b8;
--txt:#e6f3f7;--mut:#8db1c0;--ok:#62c370;--red:#e0564f;
--rC:#b8c7cf;--rP:#62c370;--rR:#4fa3ff;--rE:#b77bff;--rL:#f6c945}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.pl{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fbf3dc 30%,#e8cf8a 65%,#a8862e);vertical-align:-.1em}
.gtxt{color:var(--gold)}.mut{color:var(--mut)}.cy{color:var(--cyan)}.ok{color:var(--ok)}.no{color:var(--red)}
#app{position:relative;display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 18%,#0f3a4d 0%,var(--bg) 70%)}
header{flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px}
.hl{min-width:0}
.gold{font-size:28px;font-weight:900;line-height:1.05;color:var(--gold);white-space:nowrap;text-shadow:0 2px 0 #5a4206}
#pps{display:block;padding:1px 0;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
#pps small{font-size:11px;opacity:.8}
.pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:54%}
.pill{padding:2px 9px;font-size:13px;font-weight:800;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px}
#hero{position:relative;flex:0 0 210px;height:210px;overflow:hidden;border-radius:0 0 18px 18px;transition:box-shadow .3s}
#hero.z1{background:linear-gradient(180deg,#1f8fa8 0%,#0d5e78 55%,#06141c 100%)}
#hero.z2{background:linear-gradient(180deg,#1d6e5a 0%,#0b3b3a 55%,#06141c 100%)}
#hero.z3{background:linear-gradient(180deg,#1450a0 0%,#0a2c5c 55%,#06141c 100%)}
#hero.z4{background:linear-gradient(180deg,#23206b 0%,#110f3a 55%,#06141c 100%)}
#hero.z5{background:linear-gradient(180deg,#0b0b1e 0%,#05060f 60%,#06141c 100%)}
#hero.z6{background:radial-gradient(ellipse at 50% 110%,#5a1308 0%,transparent 55%),linear-gradient(180deg,#1a0707 0%,#070303 60%,#06141c 100%)}
#hero.marea{box-shadow:inset 0 0 40px #f6c94566}
#sea{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hero .flash{position:absolute;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
.chip{position:absolute;left:10px;top:8px;z-index:5;min-height:40px;padding:7px 11px;font-size:12.5px;font-weight:800;white-space:nowrap;background:#0a1f2bcc;border:1px solid var(--line);border-radius:20px}
.chip.act{color:var(--gold);border-color:var(--gold);box-shadow:0 0 10px #f6c94555}
#evPill{position:absolute;left:50%;top:10px;z-index:5;max-width:38%;padding:5px 10px;overflow:hidden;font-size:11.5px;font-weight:800;color:var(--cyan);text-overflow:ellipsis;white-space:nowrap;background:#06141ccc;border:1px solid var(--cyan2);border-radius:14px;transform:translateX(-50%)}
.hbtns{position:absolute;right:10px;top:8px;z-index:5;display:flex;flex-direction:column;gap:6px}
.rb{position:relative;width:40px;height:40px;font-size:19px;line-height:1;background:#0a1f2bcc;border:1px solid var(--line);border-radius:50%}
.dot{position:absolute;top:-3px;right:-3px;display:none;width:12px;height:12px;background:var(--red);border:2px solid var(--bg);border-radius:50%}
.new>.dot{display:block}
#depth{position:absolute;left:12px;top:56px;z-index:4;width:96px;height:104px;text-align:left}
#depth .trk{position:absolute;display:block;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#1f8fa8,#1d6e5a,#1450a0,#23206b,#0b0b1e,#5a1308);border-radius:3px;box-shadow:0 0 0 1px #ffffff26}
#depth .tk{position:absolute;display:block;left:-1px;width:8px;height:8px;margin-top:-4px;background:#06141c;border:1.5px solid #8db1c0aa;border-radius:50%}
#depth .mk{position:absolute;left:-4px;top:-7px;display:flex;align-items:center;gap:4px;will-change:transform}
#depth .mk i{display:block;flex:0 0 14px;height:14px;background:var(--gold);border:2px solid #fff6;border-radius:50%;box-shadow:0 0 8px var(--gold)}
#depth .mk span{padding:1px 6px;font-size:11px;font-weight:800;color:var(--pearl);white-space:nowrap;background:#0009;border-radius:8px}
#hint{position:absolute;left:50%;top:4px;z-index:6;padding:3px 12px;font-size:13px;font-weight:900;color:#2a1c00;background:var(--gold);border-radius:12px;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,4px)}}
#oyster{position:absolute;left:50%;top:26px;z-index:3;width:150px;height:118px;margin-left:-75px;cursor:pointer;touch-action:none;filter:drop-shadow(0 10px 12px #000a)}
#oyster::before{content:"";position:absolute;inset:-26px;z-index:-1;background:radial-gradient(circle,#4fe3e033 0%,transparent 65%);border-radius:50%;animation:breath 3s ease-in-out infinite}
.oy-top{position:absolute;left:4px;right:4px;top:0;height:58px;background:repeating-linear-gradient(100deg,#0000 0 10px,#0002 10px 13px),linear-gradient(180deg,#bfae8f,#8a785c);border:3px solid #5b4c37;border-radius:50% 50% 40% 40%/70% 70% 30% 30%;transform-origin:50% 100%;transform:rotate(-8deg) translateY(-6px)}
.oy-bot{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(180deg,#cdbfa3,#7d6c52);border:3px solid #5b4c37;border-radius:50% 50% 46% 46%/30% 30% 70% 70%;box-shadow:inset 0 6px 0 #e9dcc2}
.oy-in{position:absolute;left:12px;right:12px;bottom:26px;height:34px;background:radial-gradient(ellipse at 50% 40%,#fdf7ff,#d9c7f2 45%,#9fd3e0 80%);border-radius:50%}
.oy-pearl{position:absolute;left:50%;bottom:34px;width:46px;height:46px;margin-left:-23px;background:radial-gradient(circle at 35% 30%,#fff,#fbf3dc 30%,#e8cf8a 65%,#a8862e);border-radius:50%;box-shadow:0 0 18px #f6c94588;animation:pulse 2.2s ease-in-out infinite}
#oyster.hit .oy-top{animation:snap .16s ease-out}
#oyster.hit .oy-pearl{animation:pp .16s ease-out}
@keyframes snap{50%{transform:rotate(0) translateY(4px)}}
@keyframes pp{50%{transform:scale(.92)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes breath{50%{opacity:.55;transform:scale(.92)}}
#hud{position:absolute;left:0;right:0;bottom:6px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.mtr{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--pearl);text-shadow:0 1px 2px #000}
.mbar{display:block;width:120px;height:8px;overflow:hidden;background:#0009;border-radius:4px;box-shadow:0 0 0 1px #ffffff1f}
.mbar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan));box-shadow:0 0 6px var(--cyan)}
.marea .mbar i{background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 6px var(--gold)}
.marea .mtr{color:var(--gold)}
#tapInfo{font-size:12px;font-weight:700;color:var(--mut);text-shadow:0 1px 2px #000}
#goldfish{position:absolute;left:0;top:0;z-index:6;width:56px;height:56px;font-size:40px;line-height:56px;filter:drop-shadow(0 0 8px #f6c945);will-change:transform}
#goal{flex:0 0 46px;display:flex;align-items:center;gap:10px;height:46px;margin:5px 10px 3px;padding:0 12px;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:12px}
#goal .gi{flex:0 0 auto;font-size:22px}
#goal .gm{flex:1;min-width:0}
#goal .gt{display:block;overflow:hidden;font-size:13px;font-weight:800;white-space:nowrap;text-overflow:ellipsis}
#goal .gb{display:block;height:4px;margin-top:4px;overflow:hidden;background:#0008;border-radius:2px}
#goal .gb i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan))}
#goal .gr{flex:0 0 auto;max-width:30%;overflow:hidden;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;text-overflow:ellipsis}
#panel{flex:1 1 auto;min-height:0;padding:0 10px 10px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tab{display:none}.tab.on{display:block}
.sp{display:none}.sp.on{display:block}
.thead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;background:var(--bg)}
.thead .tools{display:flex;gap:6px;margin-left:auto}
.seg{display:flex;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px}
.seg button{position:relative;min-width:58px;min-height:42px;padding:0 8px;font-weight:900;color:var(--mut)}
.seg button.on{color:#2a1c00;background:var(--gold)}
.seg button.lk{opacity:.45}
.seg.wide{flex:1}.seg.wide button{flex:1;min-width:0;padding:0 4px;font-size:13px}
.sec{margin:14px 4px 8px;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.5px;text-transform:uppercase}
.zh{margin:12px 2px 6px;font-size:13px;font-weight:900;color:var(--cyan);letter-spacing:.3px}
.zh.lk{color:var(--mut)}
.req{margin:3px 0 0 6px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:0}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:72px;margin-bottom:8px;padding:10px;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;transition:transform .06s}
.row:active{transform:scale(.98)}
.row.off{opacity:.55}
.row.done{opacity:.5}
.row.sm{min-height:48px;padding:8px 10px}
.ic{flex:0 0 48px;display:grid;place-items:center;width:48px;height:48px;font-size:30px;background:#0006;border-radius:12px}
.info{flex:1;min-width:0}
.nm{font-size:16px;font-weight:900}
.cnt{float:right;margin-left:8px;color:var(--gold)}
.sub{margin-top:2px;overflow:hidden;font-size:12.5px;color:var(--mut);white-space:nowrap;text-overflow:ellipsis}
.sub.w{white-space:normal;overflow:visible}
.trait{margin-top:2px;font-size:11.5px;line-height:1.25;color:var(--cyan)}
.ms{margin-top:3px;font-size:11px;color:var(--mut)}
.bar{height:6px;margin-top:6px;overflow:hidden;background:#0008;border-radius:4px}
.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .2s}
.buy{flex:0 0 auto;min-width:88px;padding:8px 6px;font-weight:900;text-align:center;color:#2a1c00;background:linear-gradient(180deg,#ffd862,#d9a21f);border-radius:10px}
.buy small{display:block;font-size:11px;opacity:.75}
.row.off .buy{color:#a9c3cf;background:#1b4459}
.row.done .buy{color:var(--ok);background:none}
.buy.danger{color:#fff;background:#8e2b26}
.row.sil .ic{filter:brightness(0) opacity(.5)}
.row.sil .cnt,.row.sil .trait,.row.sil .bar,.row.sil .ms,.row.sil .buy{display:none}
.row.sil{opacity:.7}
#tabs{flex:0 0 58px;display:flex;background:var(--bg2);border-top:1px solid var(--line)}
#tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:7px 0 6px;font-size:22px;line-height:1;color:var(--mut)}
#tabs button span{font-size:11px;font-weight:800}
#tabs button.on{color:var(--gold);background:#f6c94512;box-shadow:inset 0 3px 0 var(--gold)}
#tabs button.lk{opacity:.45}
#tabs button .lki{position:absolute;top:4px;left:calc(50% + 8px);font-size:11px}
#tabs .dot{top:5px;right:calc(50% - 20px)}
#banner{flex:0 0 50px;display:flex;align-items:center;justify-content:center;height:50px;font-size:12px;color:#5f8090;letter-spacing:.5px;background:#040d12;border-top:1px dashed #1e4a5f}
#banner.hide{display:none}
.btn{display:block;width:100%;min-height:54px;padding:10px;font-size:17px;font-weight:900;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.btn.g{color:#2a1c00;background:linear-gradient(180deg,#ffd862,#d9a21f);border-color:#a87810}
.btn.r{color:#fff;background:#8e2b26;border-color:#c0443d}
.btn.s{min-height:44px;font-size:15px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.asc{padding:6px 4px 14px;text-align:center}
.bigic{font-size:60px;filter:drop-shadow(0 0 14px #4fe3e066)}
.ah{margin-top:2px;font-size:22px;font-weight:900}
.card{margin:12px 0;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px}
.card b.v{display:block;margin-top:4px;font-size:24px}
.card small{display:block;margin-top:6px;font-size:12.5px}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;font-size:12px;font-weight:900;color:#2a1c00;vertical-align:3px;background:var(--gold);border-radius:10px}
.note{margin-top:12px;font-size:12.5px;line-height:1.4}
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:#000b}
.ov.hidden{display:none}
.mbox{width:100%;max-width:380px;max-height:90%;padding:20px;overflow-y:auto;text-align:center;background:linear-gradient(180deg,#123548,#0a1f2b);border:2px solid var(--gold2);border-radius:20px;box-shadow:0 20px 50px #000}
.mbox h2{margin-bottom:10px;font-size:21px;color:var(--gold)}
.mbody{margin-bottom:16px;line-height:1.4}
.mbody p{margin:6px 0}
.big{margin:10px 0;font-size:30px;font-weight:900;color:var(--gold)}
.mbtns{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.day{padding:6px 2px;font-size:11px;line-height:1.25;background:#0006;border:1px solid var(--line);border-radius:10px}
.day b{display:block;font-size:20px}
.day.d7{grid-column:span 2}
.day.done{opacity:.45}
.day.cur{background:#f6c94518;border-color:var(--gold);box-shadow:0 0 10px #f6c94566}
.dl{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;font-size:13.5px;text-align:left;border-bottom:1px solid #ffffff12}
.dl b{white-space:nowrap}
.dl.dim{opacity:.4}
.dl.tot{font-weight:900;color:var(--gold);border-bottom-color:var(--gold2)}
#sheet{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
.shd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}
.shd h2{font-size:20px;color:var(--gold)}
.sbody{flex:1;min-height:0;padding:0 10px 16px;overflow-y:auto}
#adov{z-index:200;background:#000e}
.adbox{width:100%;max-width:340px;padding:28px 20px;text-align:center;background:#1b1b1b;border:1px solid #444;border-radius:16px}
.adtag{display:inline-block;margin-bottom:14px;padding:3px 8px;font-size:11px;font-weight:900;color:#000;letter-spacing:1px;background:#ffcc00;border-radius:4px}
.adbar{height:6px;margin-top:18px;overflow:hidden;background:#333;border-radius:3px}
.adbar i{display:block;width:0;height:100%;background:var(--gold)}
#adov.run .adbar i{animation:fill var(--d,2s) linear forwards}
@keyframes fill{to{width:100%}}
#fx{position:fixed;inset:0;z-index:50;overflow:hidden;pointer-events:none}
.ft{position:absolute;left:0;top:0;font-size:22px;font-weight:900;color:var(--gold);white-space:nowrap;text-shadow:0 2px 0 #000,0 0 8px #000;opacity:0;will-change:transform,opacity}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 60px);z-index:150;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:90%;padding:8px 14px;font-size:14px;font-weight:800;text-align:center;color:var(--gold);background:#000d;border:1px solid var(--gold2);border-radius:20px;animation:tin 2.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.tgl{min-height:42px;padding:0 10px;font-size:13px;font-weight:900;color:var(--mut);white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tgl.on{color:var(--cyan);border-color:var(--cyan2);box-shadow:0 0 8px #4fe3e044}
#drone{position:absolute;inset:-24px;z-index:4;pointer-events:none;animation:spin 6s linear infinite}
#drone i{position:absolute;left:50%;top:0;width:22px;margin-left:-11px;font-size:18px;font-style:normal;line-height:1;text-align:center;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ct{font-size:15px;font-weight:900;line-height:1.3}
.card.gl{border-color:var(--gold2);box-shadow:inset 0 0 0 1px #f6c94533}
.card .btn{margin-top:10px}
.card p{margin-top:6px;font-size:13.5px;line-height:1.35}
.card .et{font-size:15px;font-weight:800;color:var(--txt)}
.lbl{margin:10px 0 2px;font-size:12px;font-weight:800;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-width:46px;min-height:42px;padding:0 10px;font-size:14px;font-weight:900;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:12px}
.chips button.on{color:#2a1c00;background:var(--gold);border-color:var(--gold)}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.durs button{min-width:0;min-height:50px;padding:4px 2px;font-size:14px;font-weight:900;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.durs button small{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}
.durs button.on{color:#2a1c00;background:var(--gold);border-color:var(--gold)}
.durs button.on small{color:#5a4206}
.durs button:disabled,.chips button:disabled{opacity:.35}
.pv{font-size:13px;font-weight:800;color:var(--pearl)}
.card p.small,.small{font-size:12px}
.bay .bh{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:900}
.bay .tm{flex:0 0 auto;color:var(--cyan);font-variant-numeric:tabular-nums}
.bay.rdy{border-color:var(--gold2)}
.bay.rdy .tm{color:var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:8px}
.spc{min-width:0;min-height:112px;padding:8px 4px;text-align:center;background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid var(--line);border-radius:12px}
.spc .si{font-size:34px;line-height:1.15}
.spc .sn{margin-top:2px;font-size:12px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.spc .ss{margin-top:3px;font-size:11px;line-height:1.2;color:var(--gold)}
.spc.unk{border-style:dashed;opacity:.72}
.spc.unk .ss{color:var(--mut)}
.spr{display:flex;align-items:center;gap:10px;margin:5px 0;padding:6px 8px;text-align:left;background:#0005;border-left:4px solid;border-radius:8px}
.spr .si{font-size:26px}
.spr .sn{flex:1;min-width:0;font-size:13.5px}
.spr .sn small{display:block;font-size:11.5px;font-weight:800}
.spr .tag{font-size:12.5px;color:var(--gold);white-space:nowrap}
.spbig{font-size:64px;line-height:1.1}

function zoneBlocks(z) {

  out.push({ok: S.run >= Z.thr * scale(), txt: `Gana ${fmt(Z.thr * scale())} perlas en esta expedición`, short: `faltan ${fmt(Math.max(0, Z.thr * scale() - S.run))} perlas`});

const pearlBlocked = z => zoneBlocks(z).slice(1).some(r => !r.ok);
function depthInfo() {
  const z = curZone || openZone(), sc = scale();

    const a = Math.log10(Math.max(1, ZONES[z - 1].thr * sc)), b = Math.log10(ZONES[z].thr * sc);
    x = clamp((Math.log10(Math.max(1, S.run)) - a) / (b - a), 0, 1);

}

function handleAway(t) {
  lastT = Date.now();
  t = Math.max(0, t);
  if (!(t > 0)) return;
  runH('onAway', t);
  const pb = prodBase();
  if (t < OFFLINE_MIN) { earn(pb * t); return; }
  const tt = Math.min(t, OFFLINE_MAX), g = pb * tt, lines = [];
  for (const f of Hooks.offlineLines) { try { lines.push(...(f(t) || [])); } catch (e) { console.error(e); } }
  if (!(g > 0) && !lines.length) return;
  S.flags.offG = g > 0 ? g : 0;
  save();
  modal({title: '🌊 Mientras no estabas',
    body: `<p>Tu estación siguió trabajando durante ${fmtTime(tt)}${t > OFFLINE_MAX ? ' (máx. 8 h)' : ''}:</p><div class="big">+${fmt(g)} ${IC.pearl}</div>${lines.map(l => `<p>${l}</p>`).join('')}`,
    buttons: [
      g > 0 && {t: `📺 Duplicar (+${fmt(2 * g)})`, cls: 'g', fn: () => Ads.rewarded(() => { S.flags.offG = 0; earn(2 * g); toast(`🌊 +${fmt(2 * g)} perlas`); save(); })},
      {t: 'Recoger', fn: () => { S.flags.offG = 0; earn(g); save(); naturalPause(); }},
    ].filter(Boolean)});
}
let autoDailyDay = -1;
function afterAway() {
  const d = dailyInfo();
  if (!S.flags.firstDailyShown || !d.can || autoDailyDay === d.t) return;
  autoDailyDay = d.t;
  showDaily();
}

// ===== BITÁCORA DIARIA =====
const dailyK = () => Math.min(2, 1 + 0.1 * S.daily.cycles);
function dailyInfo() {
  const t = dayNum(new Date()), d = S.daily;
  if (d.last === t) return {can: false, day: d.streak, t};
  if (d.last < 0) return {can: true, day: 1, t};
  const gap = t - d.last;
  if (gap < 0) return {can: false, day: d.streak, t};
  if (gap === 1) return {can: true, day: d.streak % 7 + 1, t};
  if (gap === 2 && !d.grace) return {can: true, day: d.streak % 7 + 1, useGrace: true, t};
  return {can: true, day: 1, broken: d.streak > 0 && d.streak < 7, t};
}
function dailyAmt(r, k) {
  if (r.min) return {p: Math.max(prodBase() * r.min * 60, 20 * r.min) * k};
  if (r.mu) return {m: Math.round(r.mu * k)};
  return {g: Math.round(r.gems * k)};
}
const dailyExtra = k => Game.dailyRoll ? ' + 🎲 Rara+' : ` + ${Math.round(D7_FALLBACK_GEMS * k)} 💎`;
function dailyLabel(r, k) {
  const a = dailyAmt(r, k);
  return (a.p != null ? `${fmt(a.p)} perlas` : a.m ? `${a.m} 🧪` : `${a.g} 💎`) + (r.roll ? dailyExtra(k) : '');
}
function dailyCell(r, k) {
  const a = dailyAmt(r, k);
  if (a.p != null) return `<b>${IC.pearl}</b>${r.min >= 60 ? r.min / 60 + ' h' : r.min + ' min'}<br>${fmt(a.p)}`;
  if (a.m) return `<b>🧪</b>${a.m} muestras`;
  return `<b>💎</b>${a.g}${r.roll ? dailyExtra(k) : ''}`;
}
function showDaily() {
  const d = dailyInfo(), k = dailyK(), D = S.daily, n = d.can ? d.day - 1 : D.streak;
  const cells = DAILY.map((r, i) => {
    const day = i + 1, done = d.can ? day < d.day : day <= D.streak, cur = d.can && day === d.day;
    return `<div class="day${done ? ' done' : ''}${cur ? ' cur' : ''}${day === 7 ? ' d7' : ''}">Día ${day}${dailyCell(r, k)}${done ? ' ✔' : ''}</div>`;
  }).join('');
  const msg = (d.useGrace ? `<p class="cy">${IC.grace} Día de gracia: faltaste un día y tu racha sigue.</p>` : '') +
    (d.broken ? '<p class="cy">🌊 Nuevo ciclo de bitácora: empiezas otra vez en el día 1. No pierdes nada de lo que ganaste.</p>' : '') +
    `<p class="mut">${d.can ? '¡Tu recompensa de hoy te espera!' : 'Ya la recogiste hoy. ¡Vuelve mañana!'}</p>`;
  modal({title: '📅 Bitácora diaria',
    body: `<p>Racha: <b class="gtxt">${n}/7</b> · Ciclos completados: ${D.cycles} (premios ×${fmtN(k)})</p><div class="days">${cells}</div>${msg}`,
    buttons: d.can ? [{t: `🎁 Recoger día ${d.day}`, cls: 'g', fn: claimDaily}, {t: 'Más tarde'}] : [{t: 'Cerrar'}]});
}
function claimDaily() {
  const d = dailyInfo();
  if (!d.can) return;
  const D = S.daily, k = dailyK(), r = DAILY[d.day - 1], a = dailyAmt(r, k), label = dailyLabel(r, k);
  if (a.p != null) earn(a.p);
  if (a.g) S.gems += a.g;
  if (a.m) S.mu += a.m;
  if (r.roll) { if (Game.dailyRoll) Game.dailyRoll(k); else S.gems += Math.round(D7_FALLBACK_GEMS * k); }
  if (d.day === 1) D.grace = false;
  if (d.useGrace) D.grace = true;
  D.last = d.t;
  D.streak = d.day;
  if (d.day === 7) D.cycles++;
  toast(`🎁 Día ${d.day}: ${label}`);
  Snd.done();
  save();
}

let lastT = Date.now(), t5 = 0, t1 = 0, t1Last = Date.now(), loopGen = 0, sessPlay = 0;
function updateTab(now) {
  if (curTab === 'gen') updGen(now);
  else if (curTab === 'up') updUp();
  else if (curTab === 'reef') updReef();
  else if (curTab === 'shop') updShop(now);
}
function tick5(now) {
  checkZone();
  updHero(now);
  updGoal();
  updTabs();
  updSegs();
  updPills();
  updateTab(now);
  runH('tick5hz', now);
}
function tick1(now) {
  const dt = clamp((now - t1Last) / 1000, 0, 5);
  t1Last = now;
  sessPlay += dt;
  invalidateCaches();
  adLim();
  const bz = Math.floor(S.b[9] / 10);
  if (bz > 0) {
    S.flags.muAcc = (+S.flags.muAcc || 0) + bz * dt / 3600;
    if (S.flags.muAcc >= 1) { const n = Math.floor(S.flags.muAcc); S.mu += n; S.flags.muAcc -= n; }
  }
  if (Game.autoFirstDaily && !S.flags.firstDailyShown && sessPlay >= FIRST_DAILY_S) {
    S.flags.firstDailyShown = 1;
    if (dailyInfo().can && !mOpen) { autoDailyDay = dailyInfo().t; showDaily(); }
  }
  runH('tick1s', now);
}
function frame() {
  const now = Date.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 5) { handleAway(dt); afterAway(); dt = 0; }
  else if (dt > 0) earn(prodNow(now) * dt);
  renderTop(now);
  Sea.draw(Math.min(dt, 0.1), now / 1000);
  if (Hooks.frame.length) runH('frame', dt, now);
  if (now - t5 >= 200) { t5 = now; tick5(now); }
  if (now - t1 >= 1000) { t1 = now; tick1(now); }
}
function startLoop() {
  const g = ++loopGen;
  lastT = Date.now();
  const f = () => { if (g !== loopGen || document.hidden) return; frame(); requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
setInterval(() => { if (!document.hidden) save(); }, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { loopGen++; save(); Snd.suspend(); return; }
  handleAway(Math.max(0, (Date.now() - S.last) / 1000));
  afterAway();
  startLoop();
});

const FISH_ODDS = [['tes', 45], ['fren', 30], ['corr', 15], ['mu', 7], ['gem', 3]];
const Fish = (() => {

  }
  function roll() { let x = Math.random() * 100; for (const [k, w] of FISH_ODDS) { if (x < w) return k; x -= w; } return 'tes'; }
  function reward(kind, k, auto) {
    const now = Date.now(), c4 = S.res.c4 ? 2 : 1, pul = 1 + Math.min(0.5, 0.05 * Math.floor(S.b[4] / 10)), pre = auto ? '🤖 ' : '';

    else { const n = Math.max(1, Math.round(2 * c4 * k)); S.gems += n; toast(`${pre}💎 +${n} gemas`); }
  }
  function place() {
    const d = (W + 56) * t / FISH_VISIBLE, x = dir > 0 ? d - 56 : W - d;
    btn.style.transform = `translate(${x.toFixed(1)}px,${(y0 + 10 * Math.sin(t * 3)).toFixed(1)}px) scaleX(${dir > 0 ? -1 : 1})`;
  }
  function spawn() {
    W = hero.clientWidth || 300;
    dir = Math.random() < 0.5 ? 1 : -1; t = 0;
    y0 = (hero.clientHeight || 210) * (0.2 + Math.random() * 0.5) - 28;
    on = true; place(); btn.classList.remove('hidden');
  }
  function end(caught) {
    on = false; btn.classList.add('hidden'); S.flags.fish1 = 1;
    if (!caught && S.guide === 4) { wait = 8; forced = true; } else { wait = interval(); forced = false; }
  }
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!on) return;
    Snd.init();
    S.fish++;
    Snd.fish(); vib(20);

    floatText(e.clientX, e.clientY, '🐡');
    end(true);
    save();
  });
  return {
    init() { if (!S.flags.fish1) { wait = FISH_FIRST; forced = true; } else wait = interval(); },
    force(s) { if (!on) { wait = Math.min(wait, s); forced = true; } },
    frame(dt) {

})();

}

// ===== MAREAS SEMANALES Y AZAR =====
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fDate = d => `${d.getDate()} de ${MESES[d.getMonth()]}`;
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const mEv = $('m-events');
function updEvents() {
  const now = new Date(), k = eventNow(), m0 = mondayOf(now);
  let h = k ? (x => `<div class="card gl"><div class="ct">${x.icon} ${x.name}</div><p>${x.text}</p><p class="mut small">Termina el domingo a las 23:59</p></div>`)(EVENT_BY_K[k])
    : `<div class="card"><div class="ct">🌊 Mareas semanales</div><p>Las Mareas empiezan en tu tercer día (${fDate(new Date(S.created + EVENT_DELAY_MS))}).</p><p class="mut small">Cada semana el océano cambia con una ventaja para todos.</p></div>`;
  h += '<div class="sec">📅 Próximas semanas</div>';
  for (let w = 1; w <= 3; w++) {
    const d = new Date(m0); d.setDate(d.getDate() + 7 * w);
    const x = EVENTS[isoWeek(d) % 4];
    h += `<div class="dl"><span>Lunes ${fDate(d)}<br><small class="mut">${x.text}</small></span><b>${x.icon} ${x.name}</b></div>`;
  }
  h += '<p class="mut note">Cada Marea vuelve cada 4 semanas y nada es exclusivo: no te pierdes nada si un día no juegas.</p>';
  setH(mEv, h);
}
const mOdds = $('m-odds');
function buildOdds() {
  const L = (a, b) => `<div class="dl"><span>${a}</span><b>${b}</b></div>`;
  const W = {C: 52.5, P: 25, R: 15, E: 6, L: 1.5};
  mOdds.innerHTML = `<div class="sec">🐡 Pez globo dorado</div>${L('🐡 Tesoro: 60 s de producción (mín. 25 toques)', '45 %')}${L('🐟 Frenesí de sardinas: producción ×3 · 30 s', '30 %')}${L('⚡ Corriente eléctrica: toques ×10 · 15 s', '15 %')}${L('🧪 Muestras: 2 por zona abierta', '7 %')}${L('💎 2 gemas', '3 %')}
<p class="mut note">🧲 Corrientes guía duplica estos premios y cada 10 🐙 Pulpos suman +5 % al Tesoro y a las muestras (máx. +50 %).</p>
<div class="sec">${IC.dive} Rareza en inmersiones</div><div class="dl"><span class="mut">Rareza</span><b class="mut">Normal · ✨ Biolum. (zonas 4-6)</b></div>${Object.keys(RARITY).map(k => L(`<span style="color:${RC(k)}">●</span> ${RARITY[k].name}`, `${fmtN(RARITY[k].w)} % · ${fmtN(W[k])} %`)).join('')}
<p class="mut note">🎯 Si 9 tiradas seguidas no dan Rara o mejor, la siguiente es Rara o mejor. Contador actual: <b id="oddsPity"></b></p>
<p class="mut note">🌍 En los océanos Pacífico, Índico, Ártico y Antártico, la mitad de las Raras, Épicas y Legendarias son especies exclusivas de ese océano.</p>
<p class="mut note">🆕 La primera inmersión en cada zona cambia su primera tirada por una especie Común o Poco común que aún no tengas.</p>
<div class="sec">📅 Tirada del día 7</div>${L(`<span style="color:${RC('R')}">●</span> Rara`, '66,7 %')}${L(`<span style="color:${RC('E')}">●</span> Épica`, '26,7 %')}${L(`<span style="color:${RC('L')}">●</span> Legendaria`, '6,7 %')}
<div class="card gl"><b>🎲 El azar solo da recursos del juego. Nada aleatorio se compra con dinero.</b></div>`;
}
const updOdds = () => { const e = $('oddsPity'); if (e) setT(e, `${Math.min(9, S.pity)}/9`); };


// ===== AUTOMATIZACIÓN =====
const autoBuyBtn = el('button', 'tgl hidden', emo('🦾 Auto')), autoUpBtn = el('button', 'tgl hidden', '⚙️ Auto');
autoBuyBtn.type = autoUpBtn.type = 'button';
$('genTools').appendChild(autoBuyBtn);
$('upTools').appendChild(autoUpBtn);
autoBuyBtn.onclick = () => { S.autoBuy = !S.autoBuy; updTools(); toast(emo(S.autoBuy ? '🦾 Autocompra de criaturas activada' : '🦾 Autocompra de criaturas en pausa')); save(); };
autoUpBtn.onclick = () => { S.autoUp = !S.autoUp; updTools(); toast(S.autoUp ? '⚙️ Autocompra de mejoras activada' : '⚙️ Autocompra de mejoras en pausa'); save(); };
function updTools() {
  autoBuyBtn.classList.toggle('hidden', !S.res.e7);
  autoBuyBtn.classList.toggle('on', S.autoBuy);
  autoUpBtn.classList.toggle('hidden', !perk('autoUp'));
  autoUpBtn.classList.toggle('on', S.autoUp);
}
const drone = el('div', 'hidden', '<i>🤖</i>');
drone.id = 'drone';
oy.appendChild(drone);
function autoUpTick() {
  if (!perk('autoUp') || !S.autoUp) return;
  const it = [];
  for (const u of TAPU) if (!S.tu[u.id] && u.zone <= curZone) it.push({c: upCost(u), f: () => { S.tu[u.id] = 1; }, ev: {kind: 't', id: u.id}});
  for (const u of GLOBU) if (!S.gu[u.id] && u.zone <= curZone) it.push({c: upCost(u), f: () => { S.gu[u.id] = 1; }, ev: {kind: 'g', id: u.id}});
  for (let i = 0; i < GEN.length; i++) if (!S.hab[i] && S.b[i] >= HAB.req) it.push({c: habCost(i), f: () => { S.hab[i] = 1; }, ev: {kind: 'h', i}});
  it.sort((a, b) => a.c - b.c);
  let n = 0;
  for (const x of it) {
    if (!(S.pearls >= x.c)) break;
    S.pearls -= x.c; x.f(); n++;
    runH('onBuy', Object.assign({qty: 1, milestone: false}, x.ev));
  }
  if (n) invalidateCaches();
}
function autoBuyTick() {
  if (!S.res.e7 || !S.autoBuy) return;
  const ms = milestones();
  for (let k = 0; k < 25; k++) {
    let best = -1, br = Infinity;
    for (let i = 0; i < GEN.length; i++) {
      if (GEN[i].zone > curZone) continue;
      const v = S.b[i] ? creatureProd(i, ms) / S.b[i] : GEN[i].prod, r = unitCost(i) / v;
      if (r < br) { br = r; best = i; }
    }
    if (best < 0) break;
    const c = unitCost(best);
    if (!(S.pearls >= c)) break;
    const before = msMult(S.b[best], ms);
    S.pearls -= c; S.b[best]++;
    runH('onBuy', {kind: 'b', i: best, qty: 1, milestone: msMult(S.b[best], ms) > before});
  }
  S.maxOwned = Math.max(S.maxOwned, ownedSum());
}

// ===== ASPECTOS DE LA OSTRA =====
const skinMnt = $('m-skins');
skinMnt.innerHTML = '';
const skinRows = SKINS.map(sk => Object.assign(mkRow(skinMnt, `<span class="sw ${sk.id}"></span>`, sk.name, '', '', () => pickSkin(sk)), {sk}));
function applySkin() { for (const s of SKINS) if (s.id) oy.classList.toggle(s.id, S.skin === s.id); }
function pickSkin(sk) {
  if (S.skins[sk.id]) { S.skin = sk.id; applySkin(); toast(`🐚 Aspecto: ${sk.name}`); save(); updSkins(); return; }
  if (sk.bruj) { toast(`🔒 Se desbloquea con ${sk.bruj} 🧭 brújulas`); return; }
  if (S.gems < sk.gems) { toast(`💎 Te faltan ${sk.gems - S.gems} gemas`); return; }
  modal({title: `🐚 ${sk.name}`, body: `<p>¿Comprar el aspecto <b>${sk.name}</b> por <b>${sk.gems} 💎</b>?</p><p class="mut note">Es solo estético: no cambia la producción.</p>`,
    buttons: [{t: `💎 Comprar (${sk.gems})`, cls: 'g', fn: () => {
      if (S.skins[sk.id] || S.gems < sk.gems) return;
      S.gems -= sk.gems; S.skins[sk.id] = 1; S.skin = sk.id;
      applySkin(); toast(`🐚 ¡Nuevo aspecto: ${sk.name}!`); Snd.buy(); save(); updSkins();
    }}, {t: 'Cancelar'}]});
}
function updSkins() {
  for (const o of skinRows) {
    const sk = o.sk, own = !!S.skins[sk.id], cur = S.skin === sk.id;
    setT(o.sub, sk.bruj ? (own ? 'Premio del Almirante · solo estético' : `Se desbloquea con ${sk.bruj} 🧭`) : sk.gems ? `${sk.gems} 💎 · solo estético` : 'La ostra de siempre');
    setT(o.buy, cur ? '✔ Puesta' : own ? 'Usar' : sk.bruj ? `🔒 ${sk.bruj} 🧭` : `💎 ${sk.gems}`);
    o.r.classList.toggle('off', !own && (!!sk.bruj || S.gems < sk.gems));
    o.r.classList.toggle('sel', cur);
  }
}

// ===== TIRADA DEL DÍA 7 =====
Game.dailyRoll = () => {
  ensureC();
  const zc0 = C.zc.slice(), r = addSp(rollSpecies(S.zoneMax, true));
  zoneDoneToasts(zc0);
  dvSig = ctSig = '';
  modal({title: '🎲 Tirada Rara+ del día 7', body: `<p class="mut">Una especie Rara o mejor de ${ZN(S.zoneMax).icon} ${ZN(S.zoneMax).name}:</p>${spRow(r)}${legLines([r])}`, buttons: [{t: '¡Genial!', cls: 'g'}]});
};

// ===== AUSENCIA =====
let awayMu = 0, awaySince = 0;
Hooks.onAway.push(t => {
  awaySince = Date.now() - t * 1000;
  awayMu = 0;
  const bz = Math.floor(S.b[9] / 10);
  if (bz > 0) {
    const acc = (+S.flags.muAcc || 0) + bz * Math.min(t, OFFLINE_MAX) / 3600;
    awayMu = Math.floor(acc);
    S.mu += awayMu;
    S.flags.muAcc = acc - awayMu;
  }
});
Hooks.offlineLines.push(() => {
  const now = Date.now(), out = [], back = S.bays.filter(b => b.end > awaySince && b.end <= now);
  back.forEach(b => { b.nt = 1; });
  if (awayMu) out.push(`${IC.mu} +${awayMu} muestras de tus Buzos`);
  if (back.length) out.push(`${IC.dive} ${back.length} ${back.length === 1 ? 'inmersión' : 'inmersiones'} de vuelta`);
  for (const n of labTick(now, true)) out.push(`🔬 Investigación terminada: ${n}`);
  return out;
});

// ===== CINTA, PUNTOS Y BITÁCORA =====
addGoal(10, () => {
  if (!guideOn()) return null;
  const g = GUIDE[S.guide];
  return {icon: '👩‍🔬', text: g.t, p: g.c() ? 1 : g.p ? clamp(g.p(), 0, 1) : 0, right: rewardShort(g.r), go: () => guideGo(g)};
});
addGoal(20, () => {
  const now = Date.now(), b = S.bays.find(x => now >= x.end);
  if (b) return {icon: '✅', text: '¡Inmersión de vuelta! Toca para recoger', p: 1, go: () => { goSeg('exp', 'dives'); collectBay(b); }};
  if (S.flags.resNew && benchFree() && S.zoneMax >= 3) return {icon: '✅', text: `Investigación terminada: ${resName(S.flags.resNew)}`, p: 1, go: () => goSeg('exp', 'lab')};
  if (encReady()) return {icon: '✅', text: 'Encargo cumplido: cóbralo', p: 1, go: () => openSheet('enc')};
  return null;
});
addGoal(40, () => {
  if (!travRecommended()) return null;
  return {icon: '⭐', text: `Travesía: +${fmt(brujPending())} 🧭`, p: 1, go: () => goReef('trav')};
});
addGoal(70, () => {
  if (guideOn()) return null;
  let best = null;
  for (const e of S.enc.list) { if (encDone(e)) continue; const p = encProg(e); if (!best || p > best.p) best = {e, p}; }
  return best && {icon: '📋', text: best.e.text, p: best.p, go: () => openSheet('enc')};
});
Hooks.tabDot.exp.push(() => {
  const now = Date.now();
  if (S.bays.some(b => now >= b.end)) return true;
  if (S.zoneMax < 3 || !benchFree()) return false;
  return !!S.flags.resNew || LAB_IDS.some(id => resState(id) === 'ok');
});
Hooks.tabDot.reef.push(travRecommended);
const logBtn = $('logBtn');
function updSheet(now) {
  const s = SEGS.sheet.cur;
  if (s === 'enc') updEnc(now); else if (s === 'ach') updAch(); else if (s === 'events') updEvents(); else updOdds();
}

// ===== GANCHOS =====
Hooks.frame.push(dt => Fish.frame(dt));
Hooks.onBuy.push(e => {
  if (e.milestone) flagInc('msN');
  if (e.kind === 'h') flagInc('habN');
  if (e.kind !== 'b') return;
  for (const x of S.enc.list) if (x.key === 'buyTop' && x.i === e.i) x.c = (x.c || 0) + e.qty;
  if (e.i === 11) grantRelic();
});
Hooks.tick1s.push(now => {
  labTick(now);
  for (const b of S.bays) if (!b.nt && now >= b.end) {
    b.nt = 1;
    toast(b.kind === 'chart' ? '🗺️ ¡Carta náutica lista! Recógela en Explorar' : `${IC.dive} ¡Inmersión de vuelta! Recógela en Explorar`);
    Snd.done();
  }
  grantRelic();
  achTick();
  encTick();
  rankCheck();
  if (S.brTot >= 100 && !S.skins['oy-oro']) { S.skins['oy-oro'] = 1; toast('🐚 ¡Ostra Dorada del Almirante desbloqueada!'); }
  if (S.res.e5) { tapCore(now, true); Sea.burst(2, now < S.mareaEnd); }
  autoUpTick();
  autoBuyTick();
});
Hooks.tick5hz.push(now => {
  guideTick(now);
  updTools();
  drone.classList.toggle('hidden', !S.res.e5);
  logBtn.classList.toggle('new', encReady());
  if (sheetOpen) updSheet(now);
  if (curTab === 'exp') updExplore(now);
  else if (curTab === 'reef') updTrav();
  else if (curTab === 'shop') updSkins();
});
Hooks.tabOpen.push((tab, seg) => {
  const now = Date.now();
  if (tab === 'sheet') return updSheet(now);
  if (tab === 'exp') { if (seg === 'lab') S.flags.resNew = ''; updExplore(now); }
  else if (tab === 'reef') updTrav();
  else if (tab === 'shop') updSkins();
});
Hooks.init.push(() => {
  const kinds = {dive: 1, chart: 1, tut: 1}, num = (o, ks) => ks.forEach(k => { o[k] = +o[k]; });
  S.bays.forEach(b => num(b, ['z', 'rolls', 'mu', 't', 'start', 'end', 'chart', 'id']));
  S.bays = S.bays.filter(b => kinds[b.kind] && b.z >= 1 && b.z <= 6 && b.rolls >= 0 && b.rolls < 50 && b.mu >= 0 && b.t > 0 && (b.kind !== 'chart' || CHARTS[b.chart - 1]));
  for (const b of S.bays) if (!(b.id > 0) || S.bays.filter(x => x.id === b.id).length > 1) b.id = newBayId();
  for (const k in S.sp) { const n = Math.floor(+S.sp[k]); if (SPECIES_BY_ID[k] && n > 0 && isFinite(n)) S.sp[k] = n; else delete S.sp[k]; }
  for (const k in S.res) if (RES_BY_ID[k] && S.res[k]) S.res[k] = 1; else delete S.res[k];
  for (const o of [S.charts, S.relics, S.visited, S.zoneDove]) for (const k in o) if (o[k]) o[k] = 1; else delete o[k];
  S.benches = S.benches.filter((b, i, a) => (b.id === 'field' || RES_BY_ID[b.id]) && a.findIndex(x => x.id === b.id) === i).slice(0, benchCount());
  const keys = {};
  S.enc.list = S.enc.list.filter(e => {
    num(e, ['target', 'base', 'start', 'c', 'i']);
    if (!ENC[e.key] || keys[e.key] || typeof e.text !== 'string' || !(e.target > 0) || !isFinite(e.target) || !isFinite(e.base || 0)) return false;
    e.base = e.base || 0; e.c = e.c || 0; e.i = clamp(Math.floor(e.i || 0), 0, GEN.length - 1);
    keys[e.key] = 1;
    return true;
  }).slice(0, 3);
  if (S.flags.resNew && !(S.flags.resNew === 'field' || RES_BY_ID[S.flags.resNew])) S.flags.resNew = '';
  S.guide = clamp(Math.floor(S.guide), 0, GUIDE.length);
  S.achN = ACH.reduce((a, x) => a + clamp(Math.floor(+S.ach[x.k] || 0), 0, 9), 0);
  S.rank = Math.min(S.rank, 50, Math.floor(S.enc.done / 10));
  if (!S.skins[S.skin]) S.skin = '';
  if (S.guide >= 10) S.flags.firstDailyShown = 1;
  buildCatalog();
  buildLab();
  buildTrav();
  buildAch();
  buildOdds();
  mDives.innerHTML = mEnc.innerHTML = mEv.innerHTML = '';
  logBtn.classList.remove('hidden');
  applySkin();
  updTools();
  Fish.init();
  encFill();
  invalidateCaches();
});


// ===== ARRANQUE =====
load();
if (S.flags.offG > 0) { earn(S.flags.offG); S.flags.offG = 0; }
Ads.noAds = S.noAds;
Ads.banner();
invalidateCaches();
buildSeg('exp');
buildSeg('reef');
buildSeg('sheet');
updBuySeg();
updMute();
if (S.taps > 0) { hintGone = true; $('hint').classList.add('hidden'); }
checkZone(true);
Hooks.goalProviders.sort((a, b) => a.order - b.order);
runH('init');
Sea.resize();
gaugeH = depthEl.clientHeight || 120;
if (S.total > 0) handleAway(Math.max(0, (Date.now() - S.last) / 1000));
afterAway();
tick5(Date.now());
startLoop();
save();
</script>
</body>
