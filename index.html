<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Imperio Idle</title>
<style>
:root{--bg:#120f0a;--bg2:#1b160f;--card:#251e14;--card2:#30271a;--line:#4a3b22;--gold:#f6c945;--gold2:#c8951c;--txt:#f4ebd6;--mut:#a8987a;--ok:#62c370;--red:#e0564f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 22%,#2c2213 0%,var(--bg) 70%)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px}
.gold{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #6b4a08}
#pps{font-size:13px;color:var(--mut);font-weight:600}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:14px;font-weight:800}
#hero{position:relative;flex:0 0 auto;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{position:absolute;top:4px;min-height:38px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:20px;font-size:13px;font-weight:800}
.chip.l{left:12px}.chip.r{right:12px}
.chip.act{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px #f6c94555}
.dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none}
.new .dot{display:block}
#chest{position:relative;width:150px;height:124px;margin-top:22px;touch-action:none;cursor:pointer;filter:drop-shadow(0 10px 16px #000b)}
#chest::before{content:"";position:absolute;inset:-28px;z-index:-1;border-radius:50%;background:radial-gradient(circle,#f6c94548 0%,transparent 65%);animation:glow 2.4s ease-in-out infinite}
.lid{position:absolute;left:4px;right:4px;top:0;height:52px;border-radius:70px 70px 6px 6px;background:linear-gradient(180deg,#a0672f,#6e3f1a);border:4px solid var(--gold2);transform-origin:50% 100%}
.base{position:absolute;left:0;right:0;bottom:0;height:76px;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#85511f,#5a3112);border:4px solid var(--gold2)}
.lid::after,.base::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2))}
.lock{position:absolute;left:50%;top:40px;z-index:2;width:30px;height:34px;margin-left:-15px;border-radius:6px;background:linear-gradient(180deg,#ffe07a,#d19a1e);border:2px solid #7a5208;box-shadow:0 2px 4px #0008}
.lock::after{content:"";position:absolute;left:50%;top:9px;width:6px;height:12px;margin-left:-3px;border-radius:3px;background:#5a3a06}
#chest.hit{animation:pop .15s ease-out}
#chest.hit .lid{animation:lid .2s ease-out}
@keyframes pop{50%{transform:scale(.9)}}
@keyframes lid{40%{transform:translateY(-8px) rotate(-7deg)}}
@keyframes glow{50%{opacity:.5;transform:scale(.92)}}
#tapInfo{margin-top:8px;font-size:13px;font-weight:700;color:var(--mut)}
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 10px 10px}
.tab{display:none}.tab.on{display:block}
.thead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 2px;background:var(--bg)}
.seg{display:flex;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px}
.seg button{min-width:62px;min-height:42px;font-weight:900;color:var(--mut)}
.seg button.on{background:var(--gold);color:#2a1c00}
.sec{margin:14px 4px 8px;color:var(--gold);font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:72px;margin-bottom:8px;padding:10px;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;transition:transform .06s}
.row:active{transform:scale(.98)}
.row.off{opacity:.55}
.row.done{opacity:.5}
.ic{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;font-size:30px;background:#0006;border-radius:12px}
.info{flex:1;min-width:0}
.nm{font-size:16px;font-weight:900}
.cnt{float:right;color:var(--gold)}
.sub{margin-top:2px;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{margin-top:3px;font-size:11px;color:var(--mut)}
.bar{height:6px;margin-top:6px;overflow:hidden;background:#0008;border-radius:4px}
.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .2s}
.buy{flex:0 0 auto;min-width:88px;padding:8px 6px;text-align:center;font-weight:900;color:#2a1c00;background:linear-gradient(180deg,#ffd862,#d9a21f);border-radius:10px}
.buy small{display:block;font-size:11px;opacity:.75}
.row.off .buy{background:#4d3f27;color:#cbb994}
.row.done .buy{background:none;color:var(--ok)}
#tabs{position:relative;flex:0 0 auto;display:flex;background:var(--bg2);border-top:1px solid var(--line)}
#tabs button{position:relative;flex:1;min-height:58px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;color:var(--mut)}
#tabs button span{font-size:11.5px;font-weight:800}
#tabs button.on{color:var(--gold);background:#f6c94512;box-shadow:inset 0 3px 0 var(--gold)}
#tabs .dot{top:6px;right:calc(50% - 20px)}
#banner{flex:0 0 50px;height:50px;display:flex;align-items:center;justify-content:center;background:#0a0806;border-top:1px dashed #3a3020;color:#6d6250;font-size:12px;letter-spacing:.5px}
#banner.hide{display:none}
.btn{display:block;width:100%;min-height:54px;padding:10px;font-size:17px;font-weight:900;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.btn.g{background:linear-gradient(180deg,#ffd862,#d9a21f);color:#2a1c00;border-color:#a87810}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.gtxt{color:var(--gold)}
.mut{color:var(--mut)}
.asc{padding:14px 4px;text-align:center}
.crown{font-size:64px;filter:drop-shadow(0 0 14px #f6c94588)}
.ah{margin-top:4px;font-size:22px;font-weight:900}
.card{margin:12px 0;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px}
.card b{display:block;margin-top:4px;font-size:24px}
.card small{display:block;margin-top:6px}
.note{margin-top:12px;font-size:12.5px}
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:#000b}
.ov.hidden{display:none}
.mbox{width:100%;max-width:380px;padding:20px;text-align:center;background:linear-gradient(180deg,#2d2416,#1d170e);border:2px solid var(--gold2);border-radius:20px;box-shadow:0 20px 50px #000}
.mbox h2{margin-bottom:10px;font-size:22px;color:var(--gold)}
.mbody{margin-bottom:16px}
.mbody p{margin:6px 0}
.big{margin:10px 0;font-size:30px;font-weight:900;color:var(--gold)}
.mbtns{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.day{padding:6px 2px;font-size:11px;background:#0006;border:1px solid var(--line);border-radius:10px}
.day b{display:block;font-size:20px}
.day.d7{grid-column:span 2}
.day.done{opacity:.45}
.day.cur{background:#f6c94518;border-color:var(--gold);box-shadow:0 0 10px #f6c94566}
#adov{z-index:200;background:#000e}
.adbox{width:100%;max-width:340px;padding:28px 20px;text-align:center;background:#1b1b1b;border:1px solid #444;border-radius:16px}
.adtag{display:inline-block;margin-bottom:14px;padding:3px 8px;font-size:11px;font-weight:900;letter-spacing:1px;color:#000;background:#ffcc00;border-radius:4px}
.adbar{height:6px;margin-top:18px;overflow:hidden;background:#333;border-radius:3px}
.adbar i{display:block;width:0;height:100%;background:var(--gold)}
#adov.run .adbar i{animation:fill var(--d,2s) linear forwards}
@keyframes fill{to{width:100%}}
#fx{position:fixed;inset:0;z-index:50;overflow:hidden;pointer-events:none}
.ft{position:absolute;font-size:22px;font-weight:900;color:var(--gold);white-space:nowrap;text-shadow:0 2px 0 #000,0 0 8px #000;transform:translate(-50%,-50%);animation:up .9s ease-out forwards}
@keyframes up{to{opacity:0;transform:translate(-50%,-150%) scale(1.15)}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);z-index:150;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:90%;padding:8px 14px;font-size:14px;font-weight:800;color:var(--gold);text-align:center;background:#000d;border:1px solid var(--gold2);border-radius:20px;animation:tin 2.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
@media (max-height:640px){#hero{height:168px}#chest{margin-top:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="gold">💰 <span id="gold">0</span></div>
      <div id="pps">0 /s</div>
    </div>
    <div class="side">
      <div class="pill">💎 <span id="gems">0</span></div>
      <div class="pill">👑 <span id="crowns">0</span></div>
    </div>
  </header>
  <section id="hero">
    <button id="boostBtn" class="chip l"></button>
    <button id="dailyBtn" class="chip r">📅 Diario<i class="dot"></i></button>
    <div id="chest"><div class="lid"></div><div class="base"></div><div class="lock"></div></div>
    <div id="tapInfo"></div>
  </section>
  <main id="panel">
    <div class="tab on" id="t-b"></div>
    <div class="tab" id="t-u"></div>
    <div class="tab" id="t-s"></div>
    <div class="tab" id="t-a"><div class="asc">
      <div class="crown">👑</div>
      <div class="ah">Coronas: <span id="aCr" class="gtxt">0</span></div>
      <div class="mut" id="aBonus"></div>
      <div class="card"><span class="mut">Oro ganado en esta partida</span><b id="aRun">0</b><div class="bar"><i id="aBar"></i></div><small id="aNeed" class="mut"></small></div>
      <div class="card"><span class="mut">Coronas al ascender</span><b id="aPend" class="gtxt">+0</b></div>
      <button class="btn g" id="aBtn">👑 Ascender</button>
      <p class="mut note">Ascender reinicia el oro, los edificios y las mejoras. Conservas coronas, gemas y compras. Cada corona da +10 % de producción para siempre.</p>
    </div></div>
  </main>
  <nav id="tabs">
    <button data-tab="b" class="on">🏘️<span>Edificios</span></button>
    <button data-tab="u">📜<span>Mejoras</span></button>
    <button data-tab="s">💎<span>Tienda</span></button>
    <button data-tab="a" id="tabA">👑<span>Ascender</span><i class="dot"></i></button>
  </nav>
  <div id="banner"></div>
</div>
<div id="modal" class="ov hidden"><div class="mbox" id="mbox"></div></div>
<div id="adov" class="ov hidden"><div class="adbox"><div class="adtag" id="adtag">ANUNCIO</div><div id="adtxt"></div><div class="adbar"><i></i></div></div></div>
<div id="fx"></div>
<div id="toasts"></div>
<script>
'use strict';
// ===== CONFIG =====
const CONFIG = [
  {name: 'Granja',     icon: '🌾', cost: 15,    prod: 0.2},
  {name: 'Aserradero', icon: '🪓', cost: 100,   prod: 1.5},
  {name: 'Mina',       icon: '⛏️', cost: 1100,  prod: 10},
  {name: 'Herrería',   icon: '⚒️', cost: 12000, prod: 60},
  {name: 'Mercado',    icon: '🧺', cost: 1.3e5, prod: 350},
  {name: 'Castillo',   icon: '🏰', cost: 1.4e6, prod: 2000},
  {name: 'Catedral',   icon: '⛪', cost: 2e7,   prod: 1.2e4},
  {name: 'Palacio',    icon: '🏛️', cost: 3.3e8, prod: 7e4},
];
const UPGRADES = [
  {id: 't1', type: 't', icon: '🧤', name: 'Guantes de cuero',   cost: 100,   mult: 2},
  {id: 't2', type: 't', icon: '🔨', name: 'Martillo de hierro', cost: 2000,  mult: 2},
  {id: 't3', type: 't', icon: '✨', name: 'Toque de Midas',     cost: 3e4,   pct: 0.01},
  {id: 't4', type: 't', icon: '🗡️', name: 'Espada de acero',    cost: 5e5,   mult: 3},
  {id: 't5', type: 't', icon: '🪄', name: 'Cetro de oro',       cost: 1e7,   pct: 0.02},
  {id: 't6', type: 't', icon: '💍', name: 'Anillo del rey',     cost: 3e8,   mult: 5},
  {id: 't7', type: 't', icon: '🐉', name: 'Aliento de dragón',  cost: 1e10,  pct: 0.03},
  {id: 't8', type: 't', icon: '🙌', name: 'Mano divina',        cost: 1e12,  mult: 10},
  {id: 'g1', type: 'g', icon: '🛤️', name: 'Caminos empedrados', cost: 2500,  mult: 1.5},
  {id: 'g2', type: 'g', icon: '🤝', name: 'Gremios',            cost: 6e4,   mult: 1.5},
  {id: 'g3', type: 'g', icon: '📜', name: 'Impuestos reales',   cost: 1.5e6, mult: 2},
  {id: 'g4', type: 'g', icon: '⛵', name: 'Rutas comerciales',  cost: 4e7,   mult: 2},
  {id: 'g5', type: 'g', icon: '🎓', name: 'Universidad real',   cost: 1e9,   mult: 2},
  {id: 'g6', type: 'g', icon: '🗺️', name: 'Conquistas',         cost: 3e10,  mult: 3},
  {id: 'g7', type: 'g', icon: '⚔️', name: 'Gran ejército',      cost: 1e12,  mult: 3},
  {id: 'g8', type: 'g', icon: '🌍', name: 'Imperio eterno',     cost: 1e14,  mult: 5},
];
const COST_MULT = 1.15, MILESTONES = [10, 25, 50, 100];
const CROWN_BONUS = 0.1, ASCEND_MIN = 4e8, CROWN_K = 10; // ~45 min hasta el primer ascenso (10 coronas)
const OFFLINE_MAX = 8 * 3600, OFFLINE_MIN = 60;
const BOOST_MS = 5 * 60e3, AD_GEMS = 10, AD_GEMS_DAY = 5;
const JUMPS = [{h: 1, gems: 20}, {h: 8, gems: 120}];
const DAILY = [{min: 15}, {gems: 5}, {min: 30}, {gems: 10}, {min: 60}, {gems: 15}, {gems: 50}];
const SAVE_KEY = 'imperioIdle_v1';

// ===== MONETIZACIÓN SIMULADA (sustituir por AdMob y Google Play Billing) =====
const Sim = (() => {
  const ov = document.getElementById('adov'), tag = document.getElementById('adtag'), txt = document.getElementById('adtxt');
  let busy = false;
  return (t, s, ms, cb) => {
    if (busy) return false;
    busy = true; tag.textContent = t; txt.textContent = s;
    ov.style.setProperty('--d', ms + 'ms');
    ov.classList.remove('hidden', 'run'); void ov.offsetWidth; ov.classList.add('run');
    setTimeout(() => { ov.classList.add('hidden'); busy = false; if (cb) cb(); }, ms);
    return true;
  };
})();
const Ads = (() => {
  const start = Date.now();
  let lastInter = 0;
  const A = {
    noAds: false,
    rewarded(cb) { Sim('ANUNCIO', '📺 Anuncio con recompensa (simulado)', 2000, cb); },
    interstitial() {
      const now = Date.now();
      if (A.noAds || now - start < 180e3 || now - lastInter < 240e3) return;
      if (Sim('ANUNCIO', 'Anuncio intersticial (simulado)', 2000)) lastInter = now;
    },
    banner() {
      const b = document.getElementById('banner');
      b.textContent = 'Publicidad · banner 320×50 (simulado)';
      b.classList.toggle('hide', A.noAds);
    },
  };
  return A;
})();
const Shop = (() => {
  const SKUS = {
    sin_anuncios:  {name: 'Sin anuncios',  icon: '🚫', desc: 'Sin banner ni intersticiales', price: '2,99 US$'},
    gemas_100:     {name: '100 gemas',     icon: '💎', desc: 'Paquete pequeño',              price: '0,99 US$'},
    gemas_500:     {name: '500 gemas',     icon: '💰', desc: 'Paquete grande',               price: '3,99 US$'},
    x2_permanente: {name: 'x2 permanente', icon: '🌟', desc: 'Duplica la producción para siempre', price: '4,99 US$'},
  };
  return {
    SKUS,
    buy(sku, onOk) {
      const p = SKUS[sku];
      if (p) Sim('GOOGLE PLAY', `Compra simulada: ${p.name} · ${p.price}`, 1500, () => onOk && onOk(sku));
    },
  };
})();

// ===== ESTADO =====
const fresh = () => ({gold: 0, run: 0, total: 0, crowns: 0, gems: 0, b: CONFIG.map(() => 0), up: {}, boost: 0,
  noAds: false, x2: false, daily: {last: '', streak: 0}, adg: {d: '', n: 0}, last: Date.now()});
let S = fresh();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d) { S = Object.assign(fresh(), d); S.b = CONFIG.map((_, i) => +(d.b && d.b[i]) || 0); }
  } catch (e) {}
}
function save() {
  S.last = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

// ===== UTILIDADES =====
const $ = id => document.getElementById(id);
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const SUF = ['', 'K', 'M', 'B', 'T'];
function fmt(n, dec) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return String(dec && n < 100 ? Math.floor(n * 10 + 1e-9) / 10 : Math.floor(n)).replace('.', ',');
  let e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(1000, e);
  if (v >= 1000) { v /= 1000; e++; } else if (v < 1) { v *= 1000; e--; }
  const s = e < 5 ? SUF[e] : String.fromCharCode(97 + Math.floor((e - 5) / 26), 97 + (e - 5) % 26);
  const d = v < 10 ? 2 : v < 100 ? 1 : 0, p = Math.pow(10, d);
  return (Math.floor(v * p + 1e-9) / p).toFixed(d).replace('.', ',') + s;
}
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min ${s % 60} s` : `${s} s`;
}
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function dayKey(off) {
  const d = new Date();
  d.setDate(d.getDate() + (off || 0));
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function toast(t) {
  const e = el('div', 'toast');
  e.textContent = t;
  $('toasts').appendChild(e);
  setTimeout(() => e.remove(), 2200);
}

// ===== ECONOMÍA =====
const bMult = n => MILESTONES.reduce((m, x) => n >= x ? m * 2 : m, 1);
const boostOn = () => Date.now() < S.boost;
function globalMult() {
  let m = (1 + CROWN_BONUS * S.crowns) * (S.x2 ? 2 : 1);
  UPGRADES.forEach(u => { if (u.type === 'g' && S.up[u.id]) m *= u.mult; });
  return m;
}
const unitProd = i => CONFIG[i].prod * bMult(S.b[i]);
function baseProd() {
  let p = 0;
  CONFIG.forEach((c, i) => { p += S.b[i] * unitProd(i); });
  return p * globalMult();
}
const prod = () => baseProd() * (boostOn() ? 2 : 1);
function tapValue() {
  let m = 1, pct = 0;
  UPGRADES.forEach(u => { if (u.type === 't' && S.up[u.id]) { if (u.mult) m *= u.mult; if (u.pct) pct += u.pct; } });
  return m + pct * prod();
}
function addGold(x) { S.gold += x; S.run += x; S.total += x; }
const unitCost = i => CONFIG[i].cost * Math.pow(COST_MULT, S.b[i]);
const costOf = (i, k) => unitCost(i) * (Math.pow(COST_MULT, k) - 1) / (COST_MULT - 1);
function maxAff(i) {
  let k = Math.floor(Math.log(S.gold * (COST_MULT - 1) / unitCost(i) + 1) / Math.log(COST_MULT));
  while (k > 0 && costOf(i, k) > S.gold) k--;
  return Math.max(0, k);
}
let buyMode = 1;
const qty = i => buyMode === 'max' ? Math.max(1, maxAff(i)) : buyMode;
function buyB(i) {
  const k = qty(i), c = costOf(i, k);
  if (S.gold < c) return;
  const before = bMult(S.b[i]);
  S.gold = Math.max(0, S.gold - c);
  S.b[i] += k;
  if (bMult(S.b[i]) > before) toast(`${CONFIG[i].icon} ¡${CONFIG[i].name} produce x${bMult(S.b[i])}!`);
  refresh();
}
function buyU(u) {
  if (S.up[u.id] || S.gold < u.cost) return;
  S.gold -= u.cost;
  S.up[u.id] = 1;
  toast(`${u.icon} ${u.name}`);
  buildUpgrades();
  refresh();
}
const pending = () => S.run < ASCEND_MIN ? 0 : Math.floor(CROWN_K * Math.sqrt(S.run / ASCEND_MIN));
function ascend() {
  const p = pending();
  if (!p) return;
  modal({title: '👑 Ascender',
    body: `<p>Obtendrás <b class="gtxt">+${p} coronas</b> (+${p * 10} % de producción permanente).</p><p class="mut">Se reinician el oro, los edificios y las mejoras.</p>`,
    buttons: [{t: '👑 Ascender', cls: 'g', fn: () => {
      S.crowns += p; S.gold = 0; S.run = 0; S.b = CONFIG.map(() => 0); S.up = {};
      save(); buildUpgrades(); refresh();
      toast(`👑 ¡+${p} coronas!`);
      Ads.interstitial();
    }}, {t: 'Cancelar'}]});
}

// ===== OFFLINE, DIARIO, ANUNCIOS Y GEMAS =====
function offline(sec) {
  if (sec < OFFLINE_MIN) { addGold(baseProd() * sec); return; }
  const t = Math.min(sec, OFFLINE_MAX), g = baseProd() * t;
  if (g <= 0) return;
  modal({title: '🏰 ¡Bienvenido de vuelta!',
    body: `<p>Mientras no estabas (${fmtTime(t)}${sec > OFFLINE_MAX ? ', máx. 8 h' : ''}) tu imperio produjo:</p><div class="big">💰 ${fmt(g)}</div>`,
    buttons: [
      {t: `📺 Duplicar (${fmt(g * 2)})`, cls: 'g', fn: () => Ads.rewarded(() => { addGold(g * 2); toast(`💰 +${fmt(g * 2)}`); refresh(); })},
      {t: 'Recoger', fn: () => { addGold(g); refresh(); Ads.interstitial(); }},
    ]});
}
function dailyInfo() {
  if (S.daily.last === dayKey()) return {can: false, day: S.daily.streak};
  return {can: true, day: S.daily.last === dayKey(-1) ? S.daily.streak % 7 + 1 : 1};
}
const dailyGold = r => Math.max(baseProd() * r.min * 60, 50 * r.min);
const dailyLabel = r => r.gems ? `💎 ${r.gems}` : `💰 ${fmt(dailyGold(r))}`;
function showDaily() {
  const d = dailyInfo();
  const cells = DAILY.map((r, i) => {
    const n = i + 1, done = d.can ? n < d.day : n <= d.day;
    const cls = done ? 'done' : d.can && n === d.day ? 'cur' : '';
    return `<div class="day ${cls}${n === 7 ? ' d7' : ''}">Día ${n}<b>${r.gems ? '💎' : '💰'}</b>${r.gems || fmt(dailyGold(r))}${done ? ' ✔' : ''}</div>`;
  }).join('');
  modal({title: '📅 Recompensa diaria',
    body: `<p>Racha: <b class="gtxt">${d.can ? d.day - 1 : d.day}/7</b></p><div class="days">${cells}</div><p class="mut">${d.can ? '¡Entra cada día para no perder la racha!' : 'Ya la reclamaste hoy. ¡Vuelve mañana!'}</p>`,
    buttons: d.can ? [{t: `🎁 Reclamar día ${d.day}`, cls: 'g', fn: claimDaily}, {t: 'Más tarde'}] : [{t: 'Cerrar'}]});
}
function claimDaily() {
  const d = dailyInfo();
  if (!d.can) return;
  const r = DAILY[d.day - 1];
  toast(`🎁 Día ${d.day}: ${dailyLabel(r)}`);
  if (r.gems) S.gems += r.gems; else addGold(dailyGold(r));
  S.daily = {last: dayKey(), streak: d.day};
  save(); refresh();
}
function adGemsLeft() {
  if (S.adg.d !== dayKey()) S.adg = {d: dayKey(), n: 0};
  return AD_GEMS_DAY - S.adg.n;
}
function adGems() {
  if (adGemsLeft() <= 0) return;
  Ads.rewarded(() => { adGemsLeft(); S.adg.n++; S.gems += AD_GEMS; toast(`💎 +${AD_GEMS} gemas`); refresh(); });
}
function adBoost() {
  if (boostOn()) return;
  Ads.rewarded(() => { S.boost = Date.now() + BOOST_MS; toast('⚡ ¡Producción x2 durante 5 min!'); refresh(); });
}
function jump(j) {
  const g = baseProd() * j.h * 3600;
  if (S.gems < j.gems || g <= 0) return;
  S.gems -= j.gems;
  addGold(g);
  toast(`⏩ +${fmt(g)} de oro`);
  refresh();
}
const owned = sku => (sku === 'sin_anuncios' && S.noAds) || (sku === 'x2_permanente' && S.x2);
function grant(sku) {
  if (sku === 'sin_anuncios') { S.noAds = Ads.noAds = true; Ads.banner(); }
  else if (sku === 'gemas_100') S.gems += 100;
  else if (sku === 'gemas_500') S.gems += 500;
  else if (sku === 'x2_permanente') S.x2 = true;
  toast('✅ Compra completada: ' + Shop.SKUS[sku].name);
  save(); refresh();
}

// ===== MODALES =====
const mq = [];
let mOpen = false;
function modal(o) { mq.push(o); if (!mOpen) nextModal(); }
function nextModal() {
  const o = mq.shift();
  if (!o) { mOpen = false; $('modal').classList.add('hidden'); return; }
  mOpen = true;
  const box = $('mbox');
  box.innerHTML = `<h2>${o.title}</h2><div class="mbody">${o.body}</div><div class="mbtns"></div>`;
  o.buttons.forEach(b => {
    const e = el('button', 'btn ' + (b.cls || ''), b.t);
    e.onclick = () => { nextModal(); if (b.fn) b.fn(); };
    box.lastChild.appendChild(e);
  });
  $('modal').classList.remove('hidden');
}

// ===== UI =====
function mkRow(parent, icon, name, sub, buy, fn) {
  const r = el('button', 'row', `<div class="ic">${icon}</div><div class="info"><div class="nm">${name}</div><div class="sub">${sub}</div></div><div class="buy">${buy}</div>`);
  if (fn) r.onclick = fn;
  parent.appendChild(r);
  return {r, sub: r.querySelector('.sub'), buy: r.querySelector('.buy')};
}
const tB = $('t-b'), tU = $('t-u'), tS = $('t-s');
tB.innerHTML = '<div class="thead"><span class="mut">Comprar</span><div class="seg"><button data-m="1" class="on">x1</button><button data-m="10">x10</button><button data-m="max">MAX</button></div></div>';
tB.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  buyMode = b.dataset.m === 'max' ? 'max' : +b.dataset.m;
  tB.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  updateTab();
});
const rowsB = CONFIG.map((c, i) => {
  const r = el('button', 'row', `<div class="ic">${c.icon}</div><div class="info"><div class="nm">${c.name}<span class="cnt"></span></div><div class="sub"></div><div class="bar"><i></i></div><div class="ms"></div></div><div class="buy"><small></small><span></span></div>`);
  r.onclick = () => buyB(i);
  tB.appendChild(r);
  return {r, cnt: r.querySelector('.cnt'), sub: r.querySelector('.sub'), bar: r.querySelector('.bar i'), ms: r.querySelector('.ms'), q: r.querySelector('.buy small'), c: r.querySelector('.buy span')};
});
function updB() {
  const gm = globalMult() * (boostOn() ? 2 : 1);
  rowsB.forEach((o, i) => {
    const n = S.b[i], k = qty(i), c = costOf(i, k), u = unitProd(i) * gm;
    const nx = MILESTONES.find(m => m > n), pv = MILESTONES.filter(m => m <= n).pop() || 0;
    o.cnt.textContent = n;
    o.sub.textContent = `${fmt(u, 1)}/s c/u · total ${fmt(u * n, 1)}/s`;
    o.bar.style.width = (nx ? (n - pv) / (nx - pv) * 100 : 100) + '%';
    o.ms.textContent = nx ? `🎯 ${n}/${nx} → x2 producción` : `★ x${bMult(n)} máximo`;
    o.q.textContent = 'x' + k;
    o.c.textContent = '💰' + fmt(c);
    o.r.classList.toggle('off', S.gold < c);
  });
}
const upRows = new Map();
const upDesc = u => u.mult ? `${u.type === 't' ? 'Toque' : 'Producción'} x${String(u.mult).replace('.', ',')}` : `+${Math.round(u.pct * 100)} % de la producción/s por toque`;
function buildUpgrades() {
  tU.innerHTML = '';
  upRows.clear();
  [['t', '👆 Poder de toque'], ['g', '🌍 Multiplicadores globales']].forEach(([t, title]) => {
    tU.appendChild(el('div', 'sec', title));
    UPGRADES.filter(u => u.type === t).sort((a, b) => (!!S.up[a.id] - !!S.up[b.id]) || a.cost - b.cost).forEach(u => {
      const done = !!S.up[u.id];
      const o = mkRow(tU, u.icon, u.name, upDesc(u), done ? '✔' : '💰' + fmt(u.cost), done ? null : () => buyU(u));
      if (done) o.r.classList.add('done'); else upRows.set(u, o.r);
    });
  });
}
function updU() { upRows.forEach((r, u) => r.classList.toggle('off', S.gold < u.cost)); }
tS.appendChild(el('div', 'sec', '📺 Recompensas gratis'));
const sBoost = mkRow(tS, '⚡', 'Producción x2', 'Durante 5 minutos', '📺 Ver', adBoost);
const sGems = mkRow(tS, '💎', `+${AD_GEMS} gemas gratis`, '', '📺 Ver', adGems);
tS.appendChild(el('div', 'sec', '⏩ Saltos temporales'));
const jumpRows = JUMPS.map(j => Object.assign(mkRow(tS, '⏳', `Salto de ${j.h} h`, '', `💎 ${j.gems}`, () => jump(j)), {j}));
tS.appendChild(el('div', 'sec', '🛒 Tienda'));
const skuRows = Object.keys(Shop.SKUS).map(sku => {
  const p = Shop.SKUS[sku];
  return Object.assign(mkRow(tS, p.icon, p.name, p.desc, p.price, () => { if (!owned(sku)) Shop.buy(sku, grant); }), {sku});
});
function updS() {
  const on = boostOn(), left = adGemsLeft(), bp = baseProd();
  sBoost.buy.textContent = on ? '⚡ ' + mmss((S.boost - Date.now()) / 1000) : '📺 Ver';
  sBoost.r.classList.toggle('off', on);
  sGems.sub.textContent = left > 0 ? `Quedan ${left} de ${AD_GEMS_DAY} hoy` : 'Límite diario alcanzado';
  sGems.r.classList.toggle('off', left <= 0);
  jumpRows.forEach(o => {
    o.sub.textContent = `+${fmt(bp * o.j.h * 3600)} de oro al instante`;
    o.r.classList.toggle('off', S.gems < o.j.gems || bp <= 0);
  });
  skuRows.forEach(o => {
    const own = owned(o.sku);
    o.r.classList.toggle('done', own);
    o.buy.textContent = own ? '✔ Comprado' : Shop.SKUS[o.sku].price;
  });
}
function updA() {
  const p = pending();
  let pr, need;
  $('aCr').textContent = fmt(S.crowns);
  $('aBonus').textContent = `+${fmt(S.crowns * 10)} % de producción permanente`;
  $('aRun').textContent = fmt(S.run);
  $('aPend').textContent = '+' + fmt(p);
  if (!p) {
    pr = S.run / ASCEND_MIN;
    need = `Gana ${fmt(ASCEND_MIN)} de oro en esta partida para poder ascender`;
  } else {
    const a = ASCEND_MIN * Math.pow(p / CROWN_K, 2), b = ASCEND_MIN * Math.pow((p + 1) / CROWN_K, 2);
    pr = (S.run - a) / (b - a);
    need = `Siguiente corona en ${fmt(b - S.run)} de oro`;
  }
  $('aBar').style.width = Math.min(100, pr * 100) + '%';
  $('aNeed').textContent = need;
  $('aBtn').disabled = !p;
}
$('aBtn').onclick = ascend;

let cur = 'b';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  cur = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 't-' + cur));
  $('panel').scrollTop = 0;
  updateTab();
});
const goldEl = $('gold'), ppsEl = $('pps'), boostBtn = $('boostBtn');
function renderTop() {
  goldEl.textContent = fmt(S.gold);
  ppsEl.textContent = fmt(prod(), 1) + ' /s' + (boostOn() ? ' ⚡x2' : '');
}
function updHero() {
  const on = boostOn();
  boostBtn.classList.toggle('act', on);
  boostBtn.textContent = on ? `⚡ x2 · ${mmss((S.boost - Date.now()) / 1000)}` : '📺 x2 · 5 min';
  $('dailyBtn').classList.toggle('new', dailyInfo().can);
  $('tabA').classList.toggle('new', pending() > 0);
  $('tapInfo').textContent = `+${fmt(tapValue(), 1)} por toque`;
  $('gems').textContent = fmt(S.gems);
  $('crowns').textContent = fmt(S.crowns);
}
function updateTab() {
  ({b: updB, u: updU, s: updS, a: updA})[cur]();
  updHero();
}
function refresh() { renderTop(); updateTab(); }
boostBtn.onclick = adBoost;
$('dailyBtn').onclick = showDaily;

// ===== TOQUE =====
const chest = $('chest'), fx = $('fx');
chest.addEventListener('pointerdown', e => {
  e.preventDefault();
  const v = tapValue();
  addGold(v);
  const f = el('div', 'ft');
  f.textContent = '+' + fmt(v, 1);
  f.style.left = (e.clientX + Math.random() * 40 - 20) + 'px';
  f.style.top = (e.clientY - 10) + 'px';
  fx.appendChild(f);
  if (fx.childNodes.length > 40) fx.firstChild.remove();
  setTimeout(() => f.remove(), 900);
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
  chest.classList.remove('hit'); void chest.offsetWidth; chest.classList.add('hit');
});
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive: false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});

// ===== BUCLE Y GUARDADO =====
let lastT = Date.now(), uiT = 0;
function frame() {
  const now = Date.now(), dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 10) offline(dt); else if (dt > 0) addGold(prod() * dt);
  renderTop();
  if (now - uiT > 200) { uiT = now; updateTab(); }
  requestAnimationFrame(frame);
}
setInterval(() => { if (!document.hidden) save(); }, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);

load();
Ads.noAds = S.noAds;
Ads.banner();
buildUpgrades();
if (S.total > 0) offline(Math.max(0, (Date.now() - S.last) / 1000));
if (dailyInfo().can) showDaily();
lastT = Date.now();
refresh();
requestAnimationFrame(frame);
</script>
</body>
</html>
